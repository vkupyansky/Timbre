[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "shift"
version = "0.1.0"
description = "Личный Telegram-бот с локальным преобразованием голоса"
requires-python = ">=3.12,<3.13"
license-files = ["NOTICE", "licenses/FISH-AUDIO-RESEARCH-LICENSE.md"]
dependencies = ["aiogram==3.31.0", "aiohttp==3.14.4", "pydantic==2.13.5", "python-dotenv==1.2.3"]

[dependency-groups]
dev = ["ruff==0.16.6", "mypy==2.3.1", "pytest==9.1.1", "pytest-asyncio==1.4.0", "pip-audit==2.10.1"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src", "README.md", "pyproject.toml", "uv.lock", "NOTICE",
    "licenses/FISH-AUDIO-RESEARCH-LICENSE.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shift"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
cache_dir = "/dev/null"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"
filterwarnings = ["error"]
testpaths = ["tests"]
